services:
  - type: web
    name: bekcraftuzbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEBHOOK_URL
        sync: false
      # Qiymatni shu faylga yozmang. Render Dashboard → Environment da beriladi.
      - key: WEBHOOK_SECRET
        sync: false
